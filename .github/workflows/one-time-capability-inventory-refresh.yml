name: One-time capability inventory refresh

on:
  push:
    branches:
      - agent/p07-t05-capability-fusion-foundation

permissions:
  contents: write

concurrency:
  group: capability-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[inventory generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p07-t05-capability-fusion-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate tracked repository inventory
        run: node scripts/release/generate-repository-inventory.mjs

      - name: Commit exact generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            docs/architecture/generated/repository-inventory.json
            docs/architecture/generated/repository-inventory.md
            docs/architecture/generated/reachability-map.json
            docs/architecture/generated/reachability-map.md
          )
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Generated inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): refresh repository inventory [inventory generated]"
          git push origin HEAD:agent/p07-t05-capability-fusion-foundation
