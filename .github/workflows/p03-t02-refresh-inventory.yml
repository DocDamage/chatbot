name: P03-T02 refresh generated inventory

on:
  push:
    branches:
      - agent/p03-t02-server-coverage-policy

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p03-t02-server-coverage-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run inventory:generate
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/generated
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Refresh coverage inventory after Jest gate update'
          git push origin HEAD:agent/p03-t02-server-coverage-policy
