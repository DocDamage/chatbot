name: P03-T02 refresh generated inventory

on:
  push:
    branches:
      - agent/p03-t02-server-coverage-policy

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p03-t02-server-coverage-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Finalize policy and regenerate inventory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const policyPath = 'config/server-coverage-policy.json';
          const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'));
          delete policy.tiers.A.enforceTarget;
          policy.tiers.A.enforceFromStage = 'final';
          fs.writeFileSync(policyPath, `${JSON.stringify(policy, null, 2)}\n`);
          NODE
          npm run inventory:generate
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/server-coverage-policy.json docs/architecture/generated
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'Refresh coverage policy inventory'
          git push origin HEAD:agent/p03-t02-server-coverage-policy
