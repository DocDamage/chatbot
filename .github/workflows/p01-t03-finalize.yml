          if tracker.count(anchor) != 1:
              raise SystemExit('P01-T02 tracker anchor missing or duplicated')
          tracker = tracker.replace(anchor, anchor + new_row)
          tracker_path.write_text(tracker, encoding='utf-8')

          index_path = Path('docs/implementation/RELEASE_EVIDENCE_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          final_line = 'Future tasks must append one row only after their evidence bundle and tracker status are complete.'
          if index.count(final_line) != 1:
              raise SystemExit('Evidence index final anchor missing or duplicated')
          index_row = f'| `P01-T03` | `VERIFIED` | `{implementation_commit}` | `{evidence_path.as_posix()}` | `2026-08-05` | Removed the sole client ESLint warning with an optional catch binding; zero-warning lint, client type-check, 3 focused tests, all 70 client tests, and the production build passed. |\n'
          index = index.replace(final_line, index_row + final_line)
          index_path.write_text(index, encoding='utf-8')

          handoff = f'''# P01-T03 Handoff

## Repository state

