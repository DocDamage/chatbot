name: P01-T03 evidence finalization

on:
  push:
    branches:
      - agent/p01-t03-remove-client-lint-warning

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore(P01-T03): retry evidence finalization' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify implementation commit
        run: |
          git merge-base --is-ancestor 12b4088671cf5c828dd8e6b430b5320b5544016c HEAD
          git show --stat --oneline 12b4088671cf5c828dd8e6b430b5320b5544016c
          git diff --check

      - name: Write and validate closure evidence
        run: |
          python3 scripts/p01-t03-finalize.py
          rm -f \
            scripts/p01-t03-finalize.py \
            .github/workflows/p01-t03-diagnostic.yml \
            .github/workflows/p01-t03-verify.yml \
            .github/workflows/p01-t03-finalize.yml
          git diff --check
          test -f docs/implementation/evidence/PHASE-01/P01-T03/2026-08-05_12b40886/results.json
          grep -F '| PHASE 1 | 7 | 3 | 0 | 0 | 4 |' docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md
          grep -F '| `P01-T03` | Remove the client lint warning | Codex/GitHub | `VERIFIED` |' docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md
          test "$(grep -F -c '| `P01-T03` | Remove the client lint warning |' docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md)" -eq 1
          grep -F '`P01-T04 — Repair stale gitlink/submodule state`' docs/implementation/handoffs/CURRENT_HANDOFF.md

      - name: Commit closure evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(P01-T03): record evidence and close task"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Closure commit: $(git rev-parse HEAD)"
