    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify implementation commit
        run: |
          git merge-base --is-ancestor 12b4088671cf5c828dd8e6b430b5320b5544016c HEAD
          git show --stat --oneline 12b4088671cf5c828dd8e6b430b5320b5544016c
          git diff --check

      - name: Write evidence, tracker, index, and handoff
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json

          task_id = 'P01-T03'
          branch = 'agent/p01-t03-remove-client-lint-warning'
          implementation_commit = '12b4088671cf5c828dd8e6b430b5320b5544016c'
          base_commit = 'ccab4cc0dc15463cfdbcd30576c126ee5c54ded2'
          run_id = '30986070946'
          job_id = '92241000661'
          evidence_path = Path('docs/implementation/evidence/PHASE-01/P01-T03/2026-08-05_12b40886')
          evidence_path.mkdir(parents=True, exist_ok=True)
          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          summary = f'''# P01-T03 Verification Summary

## Result

