name: CF-01 coverage repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf01-coverage-repair
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf01-repodna-architecture-graph
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            rm -rf node_modules
            sleep $((attempt * 10))
          done

      - name: Run focused CF-01 coverage suites
        run: >-
          npx jest
          src/core/coding/architecture/ArchitectureCollectorCoverage.test.ts
          src/core/coding/architecture/ArchitectureRelationshipsCoverage.test.ts
          --runInBand

      - name: Verify server and test types
        run: |
          npm run type-check:server
          npm run type-check:tests

      - name: Verify server lint
        run: npm run lint:server

      - name: Enforce full server coverage
        run: npm run test:coverage -- --runInBand

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/cf01-coverage-repair.yml

      - name: Regenerate deterministic repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/architecture/generated/repository-inventory.json
            docs/architecture/generated/repository-inventory.md
            docs/architecture/generated/reachability-map.json
            docs/architecture/generated/reachability-map.md
          )
          npm run inventory:generate
          sha256sum "${files[@]}" > /tmp/cf01-inventory.sha
          npm run inventory:generate
          sha256sum "${files[@]}" | diff - /tmp/cf01-inventory.sha
          git diff --check

      - name: Commit verified coverage repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'test(cf01): close architecture branch coverage gap'
          git push origin HEAD:agent/cf01-repodna-architecture-graph
