name: P00-T05 Final Verification and Closure

on:
  push:
    branches:
      - agent/p00-t05-create-github-milestones-issues
    paths:
      - .github/workflows/p00-t05-create-github-governance.yml
      - docs/implementation/evidence/PHASE-00/P00-T05/bootstrap/finalize_p00_t05.py

permissions:
  contents: write
  issues: write

concurrency:
  group: p00-t05-github-governance
  cancel-in-progress: false

jobs:
  finalize-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out authorized branch
        uses: actions/checkout@v4
        with:
          ref: agent/p00-t05-create-github-milestones-issues
          fetch-depth: 1

      - name: Independently verify and close P00-T05
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 docs/implementation/evidence/PHASE-00/P00-T05/bootstrap/finalize_p00_t05.py

      - name: Commit closure evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/p00-t05-create-github-governance.yml
          git add -A
          git diff --cached --check
          git commit -m "docs(P00-T05): verify and close GitHub governance task"
          git push origin HEAD:agent/p00-t05-create-github-milestones-issues
