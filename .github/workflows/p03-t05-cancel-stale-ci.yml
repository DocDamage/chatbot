name: P03-T05 cancel stale CI

on:
  push:
    branches:
      - agent/p03-t05-real-browser-e2e

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete queued CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_RUN_ID: "31079752027"
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${STALE_RUN_ID}/cancel"
