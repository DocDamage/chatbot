name: P01-T01 Final Verification and Closure

on:
  push:
    branches:
      - agent/p01-t01-reproduce-latest-ci-failure
    paths:
      - .github/workflows/p01-t01-diagnostic.yml

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out authorized branch
        uses: actions/checkout@v4
        with:
          ref: agent/p01-t01-reproduce-latest-ci-failure
          fetch-depth: 1

      - name: Generate and validate P01-T01 closure
        run: python3 docs/implementation/evidence/PHASE-01/P01-T01/finalize_p01_t01.py

      - name: Commit closure evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation
          git rm .github/workflows/p01-t01-diagnostic.yml
          git commit -m "docs(P01-T01): verify CI failure reproduction"
          git push origin HEAD:agent/p01-t01-reproduce-latest-ci-failure

      - name: Close P01-T01 issue after committed verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/29/comments" \
            -f body='P01-T01 is VERIFIED on branch `agent/p01-t01-reproduce-latest-ci-failure`. The full prescribed sequence passed in the monorepo install, while the supplied standalone client build exposed 14 undeclared `global` references. Evidence: `docs/implementation/evidence/PHASE-01/P01-T01/2026-08-05_7f3b66c2`. Only P01-T02 is authorized next.'
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/29" \
            -f state=closed -f state_reason=completed > /tmp/p01-t01-issue.json
          python3 - <<'PY'
          import json
          issue = json.load(open('/tmp/p01-t01-issue.json'))
          assert issue['state'] == 'closed'
          assert issue['state_reason'] == 'completed'
          print(f"Closed issue #{issue['number']} as completed")
          PY
