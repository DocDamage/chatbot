name: Deploy GitHub Pages

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'client/**'
      - 'scripts/release/smoke-pages-*.mjs'
      - 'docs/GITHUB_PAGES_DEMO.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'client/**'
      - 'scripts/release/smoke-pages-*.mjs'
      - 'docs/GITHUB_PAGES_DEMO.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Type-check static demo
        run: npm run type-check
        working-directory: client
        env:
          GITHUB_PAGES: 'true'
          VITE_RUNTIME_MODE: static-demo

      - name: Test static demo boundary
        run: npm run test:pages
        working-directory: client
        env:
          GITHUB_PAGES: 'true'
          VITE_RUNTIME_MODE: static-demo

      - name: Build static demo
        run: npm run build:pages
        working-directory: client
        env:
          GITHUB_PAGES: 'true'
          VITE_RUNTIME_MODE: static-demo

      - name: Smoke static artifact
        run: npm run smoke:pages
        working-directory: client

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v4

      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke deployed static demo
        run: node scripts/release/smoke-pages-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
