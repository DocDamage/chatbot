name: P03-T04 finalize accessibility CI

on:
  push:
    branches:
      - agent/p03-t04-real-accessibility-testing

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[p03-t04-ci-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/p03-t04-real-accessibility-testing
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository dependencies
        run: npm ci
      - name: Make the accessibility CI reporting truthful
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old_label = "  accessibility:\n    name: Accessibility gate (current script)"
          new_label = "  accessibility:\n    name: Accessibility gate (Axe + Playwright)"
          old_step = "      - name: Run current accessibility script\n        run: npm run a11y\n"
          new_step = """      - name: Run Axe and Playwright accessibility tests
        run: npm run a11y
      - name: Upload accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            client/test-results/accessibility/
            client/playwright-report/accessibility/
          if-no-files-found: warn
"""
          if old_label not in text:
              raise SystemExit('Accessibility job label was not found.')
          if old_step not in text:
              raise SystemExit('Accessibility run step was not found.')
          path.write_text(text.replace(old_label, new_label, 1).replace(old_step, new_step, 1))
          PY
      - name: Remove temporary finalizer and regenerate inventory
        run: |
          rm .github/workflows/p03-t04-finalize-ci.yml
          npm run inventory:generate
      - name: Commit CI and generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/ci.yml .github/workflows/p03-t04-finalize-ci.yml docs/architecture/generated/
          git commit -m "P03-T04 finalize accessibility CI [p03-t04-ci-finalized]"
          git push origin HEAD:agent/p03-t04-real-accessibility-testing
