name: P03-T02 finalize evidence and handoff

on:
  push:
    branches:
      - agent/p03-t02-server-coverage-policy

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p03-t02-server-coverage-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reconcile tracker, evidence index, and archived handoff
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`Missing expected ${label}`);
            if (text.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one ${label}`);
            }
            return text.slice(0, first) + after + text.slice(first + before.length);
          }

          const trackerPath = 'docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md';
          let tracker = fs.readFileSync(trackerPath, 'utf8');
          tracker = replaceOnce(
            tracker,
            '- Current task branch: `agent/p03-t01-split-harden-ci-jobs`\n- Current P03-T01 implementation commit: `34f01ce7f8aa52b4579b6aa883c8c9c6c7a1a594`\n- Current P03-T01 verification CI: `31062952540`',
            '- Current task branch: `agent/p03-t02-server-coverage-policy`\n- Current P03-T02 implementation commit: `b7e81e3935185c06cbaab2fb7e2ee199a69dcaca`\n- Current P03-T02 verification CI: `31066377115`',
            'tracker task metadata',
          );
          tracker = replaceOnce(
            tracker,
            '| PHASE 3 | 8 | 1 | 0 | 0 | 0 | 0 | 7 |',
            '| PHASE 3 | 8 | 2 | 0 | 0 | 0 | 0 | 6 |',
            'Phase 3 summary row',
          );
          tracker = replaceOnce(
            tracker,
            '| **Total** | **124** | **19** | **0** | **0** | **0** | **1** | **104** |',
            '| **Total** | **124** | **20** | **0** | **0** | **0** | **1** | **103** |',
            'tracker total row',
          );
          const p03t01Tracker = '| `P03-T01` | Split and harden CI jobs | Codex/GitHub | `VERIFIED` | `agent/p03-t01-split-harden-ci-jobs` | `34f01ce7f8aa52b4579b6aa883c8c9c6c7a1a594` | `docs/implementation/evidence/PHASE-03/P03-T01/2026-08-05_34f01ce7` | None | `2026-08-05` | `REQUIRED` |';
          const p03t02Tracker = '| `P03-T02` | Implement meaningful server coverage policy | Codex/GitHub | `VERIFIED` | `agent/p03-t02-server-coverage-policy` | `b7e81e3935185c06cbaab2fb7e2ee199a69dcaca` | `docs/implementation/evidence/PHASE-03/P03-T02/2026-08-05_b7e81e39` | None | `2026-08-05` | `REQUIRED` |';
          tracker = replaceOnce(tracker, p03t01Tracker, `${p03t01Tracker}\n${p03t02Tracker}`, 'P03-T01 verified row');
          tracker = replaceOnce(
            tracker,
            '| `P03-T02` | Implement meaningful server coverage policy |\n',
            '',
            'P03-T02 pending row',
          );
          fs.writeFileSync(trackerPath, tracker);

          const indexPath = 'docs/implementation/RELEASE_EVIDENCE_INDEX.md';
          let index = fs.readFileSync(indexPath, 'utf8');
          const p03t01Index = '| `P03-T01` | `VERIFIED` | `34f01ce7f8aa52b4579b6aa883c8c9c6c7a1a594` | `docs/implementation/evidence/PHASE-03/P03-T01/2026-08-05_34f01ce7` | `2026-08-05` | Eighteen independent CI jobs, Node 22/24 compatibility, aggregate enforcement, evidence validation, and build/liveness smoke passed in CI `31062952540`. |';
          const p03t02Index = '| `P03-T02` | `VERIFIED` | `b7e81e3935185c06cbaab2fb7e2ee199a69dcaca` | `docs/implementation/evidence/PHASE-03/P03-T02/2026-08-05_b7e81e39` | `2026-08-05` | Risk-based server coverage policy, expanded all-source baseline, count/percentage no-regression, 19-file Tier A inventory, Tier B manifest mapping, and staged 55/45, 65/55, and 75/65 targets passed in CI `31066377115`. |';
          index = replaceOnce(index, p03t01Index, `${p03t01Index}\n${p03t02Index}`, 'P03-T01 evidence index row');
          fs.writeFileSync(indexPath, index);

          fs.mkdirSync('docs/implementation/handoffs/archive', { recursive: true });
          fs.copyFileSync(
            'docs/implementation/handoffs/CURRENT_HANDOFF.md',
            'docs/implementation/handoffs/archive/P03-T02_HANDOFF.md',
          );
          NODE
      - run: npm run inventory:generate
      - name: Commit final P03-T02 records and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p03-t02-finalize.yml
          git add docs/implementation docs/architecture/generated
          git commit -m 'Finalize P03-T02 evidence and handoff'
          git push origin HEAD:agent/p03-t02-server-coverage-policy
