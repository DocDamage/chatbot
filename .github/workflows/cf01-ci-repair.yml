name: CF-01 one-shot CI repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf01-one-shot-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf01-repodna-architecture-graph
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Apply CF-01 correctness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          detectors = 'src/core/coding/architecture/ArchitectureDetectors.ts'
          replace_once(
              detectors,
              r'return dedupe(results, value => `${value.method}\0${value.routePath}\0${value.line}`);',
              r'return dedupe(results, value => `${value.method}\0${value.routePath}\0${value.handler}\0${value.framework}`);'
          )
          replace_once(
              detectors,
              'Object.keys(record as Record<string, unknown>).sort().forEach(dependency => dependencies.push({ name: dependency, scope, line: 1 }));',
              'Object.keys(record as Record<string, unknown>).forEach(dependency => dependencies.push({ name: dependency, scope, line: 1 }));'
          )
          replace_once(
              detectors,
              r'dependencies: dedupe(dependencies, value => `${value.scope}\0${value.name}`),',
              'dependencies: dedupe(dependencies, value => value.name),'
          )
          replace_once(
              detectors,
              '(?:[<>=!~].*)?',
              '(?:[<>=!~][^\'\"]*)?'
          )

          tools = 'src/core/tools/ArchitectureRepoTools.ts'
          old_tools = (
              "      return {\n"
              "        success: false,\n"
              "        error: error instanceof Error ? error.message : 'Repository architecture operation failed.'\n"
              "      };"
          )
          new_tools = (
              "      const candidate = error as { code?: unknown; message?: unknown } | null;\n"
              "      const missingRepository = candidate?.code === 'ENOENT'\n"
              "        || /ENOENT|no such file|not found/i.test(String(candidate?.message || ''));\n"
              "      return {\n"
              "        success: false,\n"
              "        error: missingRepository\n"
              "          ? 'Approved repository root was not found.'\n"
              "          : 'Repository architecture operation failed.'\n"
              "      };"
          )
          replace_once(tools, old_tools, new_tools)
          PY

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/cf01-ci-repair.yml

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Run focused CF-01 tests
        run: >-
          npx jest
          src/core/coding/architecture/ArchitectureBranchCoverage.test.ts
          src/core/tools/ArchitectureRepoTools.test.ts
          --runInBand

      - name: Verify server and test types
        run: |
          npm run type-check:server
          npm run type-check:tests

      - name: Verify server lint
        run: npm run lint:server

      - name: Enforce full server coverage
        run: npm run test:coverage -- --runInBand

      - name: Regenerate tracked repository inventory
        run: |
          npm run inventory:generate
          npm run inventory:generate
          git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(cf01): repair coverage assertions and refresh inventory'
          git push origin HEAD:agent/cf01-repodna-architecture-graph
