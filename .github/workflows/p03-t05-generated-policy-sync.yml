name: P03-T05 generated policy sync

on:
  push:
    branches:
      - agent/p03-t05-real-browser-e2e

permissions:
  contents: write

jobs:
  sync-generated-policy-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/p03-t05-real-browser-e2e
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate policy outputs
        run: |
          npm run inventory:generate
          node scripts/release/check-file-size.mjs --write-register
      - name: Commit generated policy outputs only
        shell: bash
        run: |
          git add docs/architecture/generated/ docs/architecture/large-file-register.md
          if git diff --cached --quiet; then
            echo "Generated policy files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P03-T05: refresh generated policy outputs"
          git push origin HEAD:agent/p03-t05-real-browser-e2e
