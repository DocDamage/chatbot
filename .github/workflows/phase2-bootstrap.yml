name: Phase 2 Bootstrap

on:
  push:
    branches: [agent/complete-through-phase-02]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-through-phase-02
          fetch-depth: 0
      - name: Apply Phase 2 payload
        shell: bash
        run: |
          cat _phase2_payload.part00 _phase2_payload.part01 _phase2_payload.part02 _phase2_payload.part03 _phase2_payload.part04 > _phase2_payload.zip
          unzip -t _phase2_payload.zip
          unzip -o _phase2_payload.zip
          rm -f _phase2_payload.zip _phase2_payload.part00 _phase2_payload.part01 _phase2_payload.part02 _phase2_payload.part03 _phase2_payload.part04 env.example .github/workflows/phase2-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Phase 2 repository hygiene foundation"
          git push origin HEAD:agent/complete-through-phase-02
