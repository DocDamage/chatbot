name: P01-T02 evidence finalization

on:
  push:
    branches:
      - agent/p01-t02-correct-clipboard-tests

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore(P01-T02): run evidence finalizer' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate evidence, tracker updates, and handoff
        run: |
          node scripts/p01-t02-finalize.mjs
          git diff --check
          test ! -e scripts/p01-t02-apply.mjs
          test ! -e scripts/p01-t02-finalize.mjs
          test ! -e .github/workflows/p01-t02-clipboard-verification.yml
          test ! -e .github/workflows/p01-t02-finalize.yml
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('docs/implementation/evidence/PHASE-01/P01-T02/2026-08-05_2882406d/results.json','utf8')); if(r.taskId!=='P01-T02'||r.status!=='VERIFIED'||r.commit!=='2882406d0d944ab62aa93c27cbf9a685084d8d5a') process.exit(1)"
          grep -F '| `P01-T02` | Correct clipboard behavior and tests | Codex/GitHub | `VERIFIED` |' docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md
          grep -F '| `P01-T02` | `VERIFIED` | `2882406d0d944ab62aa93c27cbf9a685084d8d5a` |' docs/implementation/RELEASE_EVIDENCE_INDEX.md
          grep -F '# P01-T02 Handoff' docs/implementation/handoffs/CURRENT_HANDOFF.md
          cmp docs/implementation/handoffs/CURRENT_HANDOFF.md docs/implementation/handoffs/archive/P01-T02_HANDOFF.md

      - name: Commit verified evidence and task closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(P01-T02): record evidence and close task"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Closure commit: $(git rev-parse HEAD)"
