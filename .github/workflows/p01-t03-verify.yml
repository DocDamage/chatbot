name: P01-T03 focused lint repair verification

on:
  push:
    branches:
      - agent/p01-t03-remove-client-lint-warning

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: "${{ github.event.head_commit.message == 'chore(P01-T03): run focused repair verification' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Record baseline
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          git status --short

      - name: Install repository and client dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Reproduce the exact warning
        run: |
          npm run lint:client 2>&1 | tee /tmp/p01-t03-baseline-lint.txt
          grep -F "client/src/components/LocalRunApprovalPanel.tsx" /tmp/p01-t03-baseline-lint.txt
          grep -F "'err' is defined but never used" /tmp/p01-t03-baseline-lint.txt
          grep -F "1 problem (0 errors, 1 warning)" /tmp/p01-t03-baseline-lint.txt

      - name: Apply behavior-preserving repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/src/components/LocalRunApprovalPanel.tsx')
          text = path.read_text(encoding='utf-8')
          old = """    } catch (err: any) {\n      setOutputFiles([]);\n      setOutputText('No output files are available for this run yet.');\n"""
          new = """    } catch {\n      setOutputFiles([]);\n      setOutputText('No output files are available for this run yet.');\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one exact unused catch binding, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "client/src/components/LocalRunApprovalPanel.tsx"

      - name: Verify zero-warning client lint
        run: npm run lint:client -- --max-warnings=0

      - name: Verify client type-check
        run: npm run type-check:client

      - name: Verify focused component tests
        run: npm --prefix client test -- LocalRunApprovalPanel.test.tsx

      - name: Verify full client test suite
        run: npm --prefix client test

      - name: Verify production client build
        run: npm --prefix client run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/LocalRunApprovalPanel.tsx
          git diff --cached --check
          git commit -m "fix(P01-T03): remove client lint warning"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Verified implementation commit: $(git rev-parse HEAD)"
