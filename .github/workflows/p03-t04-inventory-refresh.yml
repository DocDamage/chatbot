name: P03-T04 refresh generated inventory

on:
  push:
    branches:
      - agent/p03-t04-real-accessibility-testing

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[p03-t04-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/p03-t04-real-accessibility-testing
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository dependencies
        run: npm ci
      - name: Regenerate repository inventory
        run: npm run inventory:generate
      - name: Commit generated inventory
        run: |
          if git diff --quiet -- docs/architecture/generated/; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/generated/
          git commit -m "P03-T04 refresh generated inventory [p03-t04-generated]"
          git push origin HEAD:agent/p03-t04-real-accessibility-testing
