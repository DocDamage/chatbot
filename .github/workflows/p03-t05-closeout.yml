name: P03-T05 closeout

on:
  push:
    branches:
      - agent/p03-t05-real-browser-e2e

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/p03-t05-real-browser-e2e
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Write task evidence, tracker, index, and handoffs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          implementation = "cef6288dfe784e55fc1ad69b5ff2c786b7b83072"
          tested_merge = "b7765c365139aa193a3f77c7e56552c9169b9e56"
          ci_run = "31081497523"
          browser_job = "92551113290"
          artifact_id = "8959667465"
          artifact_digest = "sha256:dbe6da3f6ed1f5ca5eebdafc6c1f91d629dc22c534e222d1c48e5c8746e0d0fa"
          evidence_path = Path("docs/implementation/evidence/PHASE-03/P03-T05/2026-08-06_cef6288")
          evidence_path.mkdir(parents=True, exist_ok=True)

          changed_files = [
              ".github/workflows/ci.yml",
              "client/package.json",
              "client/playwright.browser.config.mjs",
              "client/src/components/SettingsMenu.tsx",
              "client/tests/browser/chat-and-auth.browser.pw.mjs",
              "client/tests/browser/degraded.browser.pw.mjs",
              "client/tests/browser/files-audio.browser.pw.mjs",
              "client/tests/browser/helpers.mjs",
              "client/tests/browser/knowledge-local-sprite.browser.pw.mjs",
              "client/tests/browser/mobile.browser.pw.mjs",
              "docs/architecture/generated/reachability-map.json",
              "docs/architecture/generated/repository-inventory.json",
              "docs/architecture/generated/repository-inventory.md",
              "docs/architecture/large-file-register.md",
              "package.json",
              "scripts/browser/local-tool-fixture.mjs",
              "scripts/browser/prepare-browser-e2e.mjs",
              "scripts/release/verify-ci-graph.mjs",
              "src/core/conversation/ConversationManager.test.ts",
              "src/core/conversation/ConversationManager.ts",
          ]

          summary = f"""# P03-T05 Verification Summary

          ## Task

          - Task: `P03-T05 — Add real browser E2E testing`
          - Status: `VERIFIED`
          - Branch: `agent/p03-t05-real-browser-e2e`
          - Implementation head: `{implementation}`
          - Pull-request merge ref tested by GitHub Actions: `{tested_merge}`
          - Draft pull request: `#162`
          - Verification CI: `{ci_run}`
          - Required CI gate: success

          ## Implemented verification program

          - Reclassified the previous Jest mock/service scenarios as `test:e2e:services` instead of presenting them as browser proof.
          - Added Playwright against the compiled React client served by the compiled production Express server.
          - Added deterministic generated text, PNG, and WAV fixtures plus an isolated SQLite runtime profile.
          - Added a no-shell local-tool fixture that exits unless the exact `P03-T05-safe-run` marker is supplied.
          - Added desktop Chromium workflows for authentication/authorization/session expiry, settings, mode switching, chat, SSE streaming, conversation persistence and reload, file loading, audio preview/loading, Knowledge Online approval, local-tool plan/approve/run, Sprite Lab manifest generation, and provider/readiness degradation.
          - Added a Pixel 5 mobile Chromium chat smoke workflow.
          - Retained Playwright JSON and HTML reports, traces, screenshots, videos, and safe local-run output as CI artifacts.
          - Made the built-server browser job an independent required CI job and extended the CI graph verifier so the gate cannot silently regress to the old smoke harness.

          ## Product defects exposed and repaired

          1. Settings reinitialization cleared its own successful save confirmation. The confirmation now survives the reload and is browser-verified.
          2. Persisted conversation summaries used lexical `MIN(content)` and `MAX(content)` values rather than chronological first/last messages. Correlated chronological queries and a focused regression test now preserve the actual first and last messages, allowing history reload to work correctly.

          ## Verification result

          - Service E2E: 3 suites, 5 tests passed.
          - Built-server Playwright: 7 of 7 workflows passed in 13.7 seconds.
          - Browser engines/profiles: desktop Chromium and Pixel 5 mobile Chromium.
          - Compiled server and client production builds passed before browser execution.
          - Browser artifact: `browser-e2e-{ci_run}`, artifact ID `{artifact_id}`, digest `{artifact_digest}`.
          - All other independent CI jobs passed: repository integrity, Node 22/24 lockfile compatibility, server/client/test type checks, server/client lint, server/client tests, accessibility, security, coverage, SQLite migrations, package smoke, Docker smoke, documentation/policy validation, and release-evidence validation.
          - Aggregate Required CI gate passed.

          ## Controlled boundaries

          - The baseline chat canary used the real configured template adapter; no provider success was fabricated.
          - Knowledge Online retrieval/ingestion and provider-outage behavior were mocked only at explicit HTTP boundaries.
          - The repository has no end-user login/logout screen yet. The suite therefore injects signed JWTs at the browser context and verifies unauthenticated, insufficient-role, expired-session, and privileged behavior against the real middleware/API boundary.
          - Live remote-provider canaries remain P06-T03 and are not claimed here.
          - Existing dependency vulnerabilities shown during install remain the explicit scope of P03-T06 and are not represented as resolved by this task.

          ## Feature-manifest impact

          No feature classification changed. This task verifies existing production-candidate workflows and CI behavior; it does not promote any feature to production-supported status.
          """.replace("          ", "")
          (evidence_path / "summary.md").write_text(summary, encoding="utf-8")

          commands = f"""# P03-T05 Commands and Results

          | Command or gate | Exit code | Result |
          |---|---:|---|
          | `npm run test:e2e` | 0 | 3 service suites / 5 tests and 7 built-server Playwright workflows passed. |
          | `npm run test:browser:prepare` | 0 | Isolated SQLite, text, image, audio, Sprite Lab, and local-tool fixtures prepared. |
          | `npm run build` | 0 | Compiled server and production client build passed before Playwright. |
          | `npm --prefix client run test:browser` | 0 | Desktop Chromium and mobile Chromium workflows passed. |
          | GitHub Actions CI `{ci_run}` | 0 | Every independent required job passed. |
          | Required CI gate in `{ci_run}` | 0 | Aggregate enforcement passed. |
          | Browser artifact upload | 0 | Artifact `{artifact_id}` uploaded with digest `{artifact_digest}`. |

          GitHub Actions checked pull-request merge ref `{tested_merge}` for implementation head `{implementation}` against current `main`.
          """.replace("          ", "")
          (evidence_path / "commands.md").write_text(commands, encoding="utf-8")

          results = {
              "taskId": "P03-T05",
              "status": "VERIFIED",
              "branch": "agent/p03-t05-real-browser-e2e",
              "implementationCommit": implementation,
              "testedMergeCommit": tested_merge,
              "verificationCi": ci_run,
              "browserJob": browser_job,
              "pullRequest": 162,
              "commands": [
                  {"command": "npm run test:e2e", "exitCode": 0},
                  {"command": "npm run test:browser:prepare", "exitCode": 0},
                  {"command": "npm run build", "exitCode": 0},
                  {"command": "npm --prefix client run test:browser", "exitCode": 0},
                  {"command": f"GitHub Actions run {ci_run} — all independent jobs and aggregate required gate", "exitCode": 0},
              ],
              "serviceE2e": {"suites": 3, "tests": 5, "passed": True},
              "browserE2e": {
                  "workflows": 7,
                  "passed": True,
                  "desktopEngine": "Chromium",
                  "mobileProfile": "Pixel 5 Chromium",
                  "durationSeconds": 13.7,
              },
              "browserArtifact": {
                  "id": int(artifact_id),
                  "name": f"browser-e2e-{ci_run}",
                  "digest": artifact_digest,
                  "retentionDays": 14,
              },
              "automatedTestsPassed": True,
              "coverageEnforcementPassed": True,
              "requiredGatePassed": True,
              "runtimeQaRequired": True,
              "runtimeQaPassed": True,
              "knownLimitations": [
                  "No end-user login/logout UI exists yet; the built-browser suite verifies JWT authentication, authorization, role denial, and expiry at the real browser/API boundary.",
                  "Live remote-provider canaries are P06-T03 and are not claimed by the real template-adapter canary in P03-T05.",
                  "Existing dependency vulnerabilities remain the explicit scope of P03-T06.",
              ],
              "evidenceGeneratedAt": "2026-08-06T03:40:00-04:00",
          }
          (evidence_path / "results.json").write_text(json.dumps(results, indent=2) + "\n", encoding="utf-8")
          (evidence_path / "changed-files.txt").write_text("\n".join(changed_files) + "\n", encoding="utf-8")

          test_output = f"""# P03-T05 Test Output Summary

          Verification CI: `{ci_run}`
          Implementation head: `{implementation}`
          Tested pull-request merge ref: `{tested_merge}`

          ```text
          PASS e2e/creative-release.test.ts
          PASS e2e/chat-flow.test.ts
          PASS e2e/knowledge-base.test.ts
          Test Suites: 3 passed, 3 total
          Tests:       5 passed, 5 total

          Running 7 tests using 1 worker
          [desktop-chromium] authentication, authorization, and expired sessions — passed
          [desktop-chromium] settings, modes, chat, SSE, persistence, reload — passed
          [desktop-chromium] provider/readiness degradation — passed
          [desktop-chromium] workspace text and audio context — passed
          [desktop-chromium] Knowledge Online explicit approval — passed
          [desktop-chromium] local-tool approval/run and Sprite Lab workflow — passed
          [mobile-chromium] Pixel 5 chat smoke — passed
          7 passed (13.7s)

          Browser artifact ID: {artifact_id}
          Browser artifact digest: {artifact_digest}
          Required CI gate: success
          ```
          """.replace("          ", "")
          (evidence_path / "test-output.txt").write_text(test_output, encoding="utf-8")

          runtime = """# P03-T05 Runtime Checklist

          - [x] Compiled server starts on an isolated test port.
          - [x] Compiled client is served by that server.
          - [x] Unauthenticated privileged request is rejected.
          - [x] Ordinary-user role is rejected from privileged settings.
          - [x] Expired JWT is rejected.
          - [x] Admin/developer JWT reaches privileged settings.
          - [x] Settings update completes and visible confirmation survives reinitialization.
          - [x] Plan and Ask modes change the real UI state.
          - [x] Chat response succeeds through the template adapter.
          - [x] SSE emits connected, chunk, and complete events.
          - [x] Conversation persists to SQLite, appears in history chronologically, and reloads into chat.
          - [x] Text fixture previews and loads into chat context.
          - [x] WAV fixture previews and loads into chat context.
          - [x] Knowledge Online preview does not ingest before explicit approval.
          - [x] Local tool requires plan and approval before start.
          - [x] Local tool uses no shell and accepts only the exact safe marker.
          - [x] Sprite Lab internal manifest workflow generates the expected output.
          - [x] Provider/readiness failure produces degraded/error state rather than false success.
          - [x] Pixel 5 mobile viewport loads and completes chat smoke.
          - [x] Browser reports and failure diagnostics are retained as CI artifacts.
          """.replace("          ", "")
          (evidence_path / "runtime-checklist.md").write_text(runtime, encoding="utf-8")

          artifacts = f"""# Retained Browser Artifact

          - Workflow run: `{ci_run}`
          - Browser job: `{browser_job}`
          - Artifact name: `browser-e2e-{ci_run}`
          - Artifact ID: `{artifact_id}`
          - Size: `256134` bytes
          - Digest: `{artifact_digest}`
          - Retention: 14 days, expiring 2026-08-20
          - Contents: Playwright HTML report, JSON results, retained traces/screenshots/videos when applicable, and safe local-run output.
          """.replace("          ", "")
          (evidence_path / "artifacts").mkdir(exist_ok=True)
          (evidence_path / "artifacts" / "README.md").write_text(artifacts, encoding="utf-8")

          tracker_path = Path("docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md")
          tracker = tracker_path.read_text(encoding="utf-8")
          tracker = tracker.replace(
              "- Current task branch: `agent/p03-t04-real-accessibility-testing`\n- Current P03-T04 implementation commit: `bb9d55ea662ed4a22b921ea1e2e08747e196a2a4`\n- Current P03-T04 verification CI: `31074967710`",
              f"- Current task branch: `agent/p03-t05-real-browser-e2e`\n- Current P03-T05 implementation commit: `{implementation}`\n- Current P03-T05 verification CI: `{ci_run}`",
          )
          tracker = tracker.replace("| PHASE 3 | 8 | 4 | 0 | 0 | 0 | 0 | 4 |", "| PHASE 3 | 8 | 5 | 0 | 0 | 0 | 0 | 3 |")
          tracker = tracker.replace("| **Total** | **124** | **22** | **0** | **0** | **0** | **1** | **101** |", "| **Total** | **124** | **23** | **0** | **0** | **0** | **1** | **100** |")
          verified_row = f"| `P03-T05` | Add real browser E2E testing | Codex/GitHub | `VERIFIED` | `agent/p03-t05-real-browser-e2e` | `{implementation}` | `docs/implementation/evidence/PHASE-03/P03-T05/2026-08-06_cef6288` | None | `2026-08-06` | `REQUIRED` |"
          anchor = "| `P03-T04` | Replace fake accessibility testing | Codex/GitHub | `VERIFIED` | `agent/p03-t04-real-accessibility-testing` | `bb9d55ea662ed4a22b921ea1e2e08747e196a2a4` | `docs/implementation/evidence/PHASE-03/P03-T04/2026-08-06_bb9d55ea` | None | `2026-08-06` | `REQUIRED` |"
          if verified_row not in tracker:
              tracker = tracker.replace(anchor, anchor + "\n" + verified_row)
          tracker = tracker.replace("| `P03-T05` | Add real browser E2E testing |\n", "")
          tracker_path.write_text(tracker, encoding="utf-8")

          index_path = Path("docs/implementation/RELEASE_EVIDENCE_INDEX.md")
          index = index_path.read_text(encoding="utf-8")
          index_row = f"| `P03-T05` | `VERIFIED` | `{implementation}` | `docs/implementation/evidence/PHASE-03/P03-T05/2026-08-06_cef6288` | `2026-08-06` | Compiled-server Playwright covered seven desktop/mobile workflows, repaired settings feedback and chronological conversation history defects, retained browser artifacts, and passed every required job plus aggregate gate in CI `{ci_run}`. |"
          if index_row not in index:
              index = index.replace("\n## Phase-level closeout evidence", "\n" + index_row + "\n\n## Phase-level closeout evidence")
          index_path.write_text(index, encoding="utf-8")

          handoff = f"""# P03-T05 Handoff

          ## Repository state

          - Repository: `DocDamage/chatbot`
          - Branch: `agent/p03-t05-real-browser-e2e`
          - Parent `main` commit: `5815d68dcd59b683d78bc0adab42fea70661ccb0`
          - Verified implementation commit: `{implementation}`
          - Tested pull-request merge ref: `{tested_merge}`
          - Pull request: `#162` (draft; not merged)
          - Verification CI: `{ci_run}` — success
          - Browser artifact: `{artifact_id}`
          - Date: `2026-08-06`

          ## Authorized task

          - Task ID: `P03-T05`
          - Title: Add real browser E2E testing
          - Status: `VERIFIED`

          ## Scope completed

          - Replaced the false browser-proof label on the old Jest harness with an explicit service E2E name.
          - Added Playwright against the compiled client served by the compiled production server.
          - Added isolated deterministic runtime fixtures and SQLite persistence.
          - Covered JWT authentication/authorization/expiry, settings, chat, streaming, persistence/reload, mode switching, file/audio workflows, Knowledge Online approval, safe local-tool approval/execution, Sprite Lab, provider degradation, and mobile viewport smoke.
          - Added artifact retention and CI-graph enforcement.
          - Repaired Settings save confirmation and chronological persisted-history defects exposed by the new gate.

          ## Verification results

          - 3 service E2E suites / 5 tests passed.
          - 7 Playwright workflows passed across desktop and mobile Chromium.
          - CI `{ci_run}` passed every independent required job and the aggregate Required CI gate.
          - Browser artifact `{artifact_id}` was uploaded with digest `{artifact_digest}`.
          - Coverage, accessibility, security, migrations, package/container smoke, repository policy, and release-evidence gates remained intact.

          ## Evidence bundle

          - `docs/implementation/evidence/PHASE-03/P03-T05/2026-08-06_cef6288`

          ## Known boundaries

          - No end-user login/logout screen exists yet; the browser suite tests the signed-JWT middleware/API boundary directly.
          - Live remote-provider canaries remain P06-T03.
          - Existing dependency vulnerabilities are not resolved here; they are the authorized scope of P03-T06.

          ## Next authorized task after merge

          - `P03-T06 — Add dependency and supply-chain gates`
          - GitHub issue: `#48`

          ## NEW THREAD START PROMPT

          ```text
          You are working on repository DocDamage/chatbot.

          AUTHORIZED TASK ONLY:
          P03-T06 — Add dependency and supply-chain gates

          Read these files before making changes:
          1. docs/implementation/handoffs/CURRENT_HANDOFF.md
          2. docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md
          3. docs/implementation/PRODUCTION_FEATURE_MANIFEST.md
          4. GitHub issue #48
          5. package.json, client/package.json, both lockfiles, all CI workflows, Dockerfiles, release scripts, and dependency/security policy files directly relevant to this task

          Rules:
          - Work only on P03-T06.
          - Confirm PR #162 is merged and inspect the exact current main commit before editing.
          - Add production dependency audit, lockfile integrity, secret scanning, SBOM generation, license inventory/policy, static security scanning, pull-request dependency review, container image scanning, and release provenance/attestation where practical.
          - Enforce zero unreviewed critical/high production vulnerabilities and require an explicit owner/rationale/control/review date for accepted moderate production risk.
          - Do not hide vulnerabilities by omitting production dependencies, weakening severity policy, skipping jobs, or adding continue-on-error.
          - Preserve the P03-T05 built-server browser gate and every existing required CI job.
          - Keep source files below 300 lines where reasonably possible and register justified exceptions.
          - Record exact commands, exit codes, workflow runs, artifacts, findings, and commit SHAs.
          - Create the P03-T06 evidence bundle, update tracker/index, archive/replace the handoff, and end the thread.
          - Do not begin P03-T07 or any later task.

          Completion requires committed evidence. End the thread after P03-T06 is verified or formally blocked.
          ```

          ## Thread closure

          This thread is closed. Do not begin P03-T06 here. After PR #162 is merged, start a new thread using the prompt above.
          """.replace("          ", "")
          Path("docs/implementation/handoffs/CURRENT_HANDOFF.md").write_text(handoff, encoding="utf-8")
          Path("docs/implementation/handoffs/archive/P03-T05_HANDOFF.md").write_text(handoff, encoding="utf-8")
          PY
      - name: Regenerate policy outputs
        run: |
          npm run inventory:generate
          node scripts/release/check-file-size.mjs --write-register
      - name: Commit closeout
        shell: bash
        run: |
          git add docs/implementation/ docs/architecture/generated/ docs/architecture/large-file-register.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P03-T05: record verified browser E2E evidence"
          git push origin HEAD:agent/p03-t05-real-browser-e2e
