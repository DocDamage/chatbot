name: P03-T03 Finalize Evidence

on:
  push:
    branches:
      - agent/p03-t03-client-coverage-thresholds
    paths:
      - .github/workflows/p03-t03-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: agent/p03-t03-client-coverage-thresholds
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Finalize tracker, index, and archived handoff
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import shutil

          branch = "agent/p03-t03-client-coverage-thresholds"
          implementation_commit = "23fcb9b18348bd05cc95c66d29e799ebb03252e8"
          verification_ci = "31069162209"
          evidence_path = "docs/implementation/evidence/PHASE-03/P03-T03/2026-08-05_23fcb9b1"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          tracker_path = Path("docs/implementation/MASTER_PRODUCTION_COMPLETION_TRACKER.md")
          tracker = tracker_path.read_text(encoding="utf-8")
          tracker = replace_once(
              tracker,
              "- Current task branch: `agent/p03-t02-server-coverage-policy`\n- Current P03-T02 implementation commit: `b7e81e3935185c06cbaab2fb7e2ee199a69dcaca`\n- Current P03-T02 verification CI: `31066377115`",
              f"- Current task branch: `{branch}`\n- Current P03-T03 implementation commit: `{implementation_commit}`\n- Current P03-T03 verification CI: `{verification_ci}`",
              "tracker metadata",
          )
          tracker = replace_once(
              tracker,
              "| PHASE 3 | 8 | 2 | 0 | 0 | 0 | 0 | 6 |",
              "| PHASE 3 | 8 | 3 | 0 | 0 | 0 | 0 | 5 |",
              "phase 3 summary",
          )
          tracker = replace_once(
              tracker,
              "| **Total** | **124** | **20** | **0** | **0** | **0** | **1** | **103** |",
              "| **Total** | **124** | **21** | **0** | **0** | **0** | **1** | **102** |",
              "total summary",
          )
          lines = tracker.splitlines()
          if not any(line.startswith("| `P03-T03` | Implement client coverage thresholds | Codex/GitHub") for line in lines):
              index = next(i for i, line in enumerate(lines) if line.startswith("| `P03-T02` | Implement meaningful server coverage policy"))
              lines.insert(
                  index + 1,
                  f"| `P03-T03` | Implement client coverage thresholds | Codex/GitHub | `VERIFIED` | `{branch}` | `{implementation_commit}` | `{evidence_path}` | None | `2026-08-05` | `REQUIRED` |",
              )
          pending = "| `P03-T03` | Implement client coverage thresholds |"
          if sum(line == pending for line in lines) != 1:
              raise SystemExit("pending P03-T03 row was not unique")
          lines = [line for line in lines if line != pending]
          tracker_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          index_path = Path("docs/implementation/RELEASE_EVIDENCE_INDEX.md")
          evidence_index = index_path.read_text(encoding="utf-8")
          index_lines = evidence_index.splitlines()
          if not any(line.startswith("| `P03-T03` | `VERIFIED` |") for line in index_lines):
              index = next(i for i, line in enumerate(index_lines) if line.startswith("| `P03-T02` | `VERIFIED` |"))
              index_lines.insert(
                  index + 1,
                  f"| `P03-T03` | `VERIFIED` | `{implementation_commit}` | `{evidence_path}` | `2026-08-05` | Expanded all-production client scope, exact global/per-file no-regression baselines, 29 critical client files, staged 65/55, 75/65, and final 80/70 targets, and client policy regression tests passed in CI `{verification_ci}`. |",
              )
          index_path.write_text("\n".join(index_lines) + "\n", encoding="utf-8")

          archive = Path("docs/implementation/handoffs/archive/P03-T03_HANDOFF.md")
          archive.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile("docs/implementation/handoffs/CURRENT_HANDOFF.md", archive)
          Path(".github/workflows/p03-t03-finalize.yml").unlink()
          PY
      - name: Refresh generated inventory
        run: npm run inventory:generate
      - name: Commit task closure
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P03-T03: commit verification evidence and handoff"
          git push origin "HEAD:${GITHUB_REF_NAME}"
