name: CF-01 exact repository inventory refresh

on:
  push:
    branches:
      - agent/cf01-repodna-architecture-graph

permissions:
  contents: write

concurrency:
  group: cf01-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[cf01 inventory generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CF-01 branch
        uses: actions/checkout@v4
        with:
          ref: agent/cf01-repodna-architecture-graph
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate exact tracked repository inventory
        run: node scripts/release/generate-repository-inventory.mjs

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            docs/architecture/generated/repository-inventory.json
            docs/architecture/generated/repository-inventory.md
            docs/architecture/generated/reachability-map.json
            docs/architecture/generated/reachability-map.md
          )
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Generated inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): refresh CF-01 repository inventory [cf01 inventory generated]"
          git push origin HEAD:agent/cf01-repodna-architecture-graph
