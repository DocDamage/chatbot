name: Temporary Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-branch-cleanup-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove merged branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            agent/p00-t05-create-github-milestones-issues \
            agent/p01-t01-reproduce-latest-ci-failure \
            agent/p01-t02-correct-clipboard-tests \
            agent/p01-t03-remove-client-lint-warning \
            agent/p01-t04-repair-gitlink-integrity \
            agent/p01-t05-decide-repair-github-pages \
            agent/p01-t06-make-all-ci-stages-execute \
            agent/p01-t07-add-branch-protection \
            release-verification-tests \
            server-work-mode-policy \
            tmp/branch-consolidation-prep \
            tmp/do-not-use \
            tmp/consolidation-runner \
            tmp/consolidation-snapshot
          do
            git push origin --delete "$branch" || true
          done
          git ls-remote --heads origin
