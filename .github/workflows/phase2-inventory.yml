name: Phase 2 Finalize Generated Evidence

on:
  push:
    branches: [agent/complete-through-phase-02]

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize Phase 2 non-workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/complete-through-phase-02
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update configuration and generate evidence
        run: node scripts/release/_phase2-finalize.mjs
      - name: Commit generated Phase 2 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Phase 2 repository hygiene evidence"
          git push origin HEAD:agent/complete-through-phase-02
